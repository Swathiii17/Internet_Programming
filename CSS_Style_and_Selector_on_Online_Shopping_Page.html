<!DOCTYPE html>
<html>
<head>
    <title>CSS Shopping Page</title>

    <style>
        /* Element selector */
        body {
            font-family: Arial;
            background-color: #eeeeee;
        }

        /* ID selector */
        #heading {
            text-align: center;
            color: blue;
        }

        /* Class selector */
        .product {
            background-color: white;
            width: 250px;
            padding: 20px;
            margin: 15px;
            display: inline-block;
            border: 2px solid black;
        }

        /* Group selector */
        h2, p {
            color: darkblue;
        }

        /* Pseudo-class */
        button:hover {
            background-color: green;
            color: white;
        }

        button {
            padding: 10px;
        }
    </style>
</head>

<body>

<h1 id="heading">Online Shopping</h1>

<div class="product">
    <h2>Laptop</h2>
    <p>₹55000</p>
    <button>Buy Now</button>
</div>

<div class="product">
    <h2>Mobile</h2>
    <p>₹20000</p>
    <button>Buy Now</button>
</div>

<div class="product">
    <h2>Watch</h2>
    <p>₹3000</p>
    <button>Buy Now</button>
</div>

</body>
</html>
