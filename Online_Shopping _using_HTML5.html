<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .product {
            display: inline-block;
            width: 220px;
            margin: 15px;
            padding: 20px;
            background: white;
            text-align: center;
            box-shadow: 0 0 5px gray;
        }

        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h1>Online Shopping</h1>

<div class="product">
    <h2>Laptop</h2>
    <p>₹55000</p>
    <button onclick="addCart('Laptop',55000)">Add to Cart</button>
</div>

<div class="product">
    <h2>Mobile</h2>
    <p>₹20000</p>
    <button onclick="addCart('Mobile',20000)">Add to Cart</button>
</div>

<div class="product">
    <h2>Headphones</h2>
    <p>₹2000</p>
    <button onclick="addCart('Headphones',2000)">Add to Cart</button>
</div>

<h2>Shopping Cart</h2>

<p id="cart"></p>

<script>
let total = 0;

function addCart(product, price) {
    total += price;

    document.getElementById("cart").innerHTML =
        "Product added: " + product +
        "<br>Total Amount: ₹" + total;
}
</script>

</body>
</html>
